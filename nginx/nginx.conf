worker_processes  1;

events {
  worker_connections  1024;
}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
  limit_req_status 429;

  # --- Upstream: destino interno dentro da rede Docker ---
  upstream clinica_api_upstream {
    server clinica-api:8080;
    keepalive 16;
  }
 
  server {
    listen 80;

    # Headers de segurança (Macro 3)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /health {
      default_type application/json;
      return 200 '{"status":"ok","component":"nginx"}';
    }

    # Proxy reverso: tudo que chega no Nginx vai para a API
    location / {
      proxy_http_version 1.1;

      limit_req zone=api_limit burst=10 nodelay;

      # Encaminha para a API
      proxy_pass http://clinica_api_upstream;

      # Headers básicos de proxy (ajudam a API a saber origem real)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}