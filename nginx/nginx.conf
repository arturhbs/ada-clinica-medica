worker_processes  1;

events {
  worker_connections  1024;
}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
  limit_req_status 429;
  
  # GZIP
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/json text/plain;

  # Log estruturado
  log_format clinica_structured
    '$remote_addr - $request_method $request_uri '
    'status=$status upstream_time=$upstream_response_time request_time=$request_time '
    'bytes=$body_bytes_sent';

  access_log /var/log/nginx/access.log clinica_structured;
  
  # --- Upstream: destino interno dentro da rede Docker ---
  upstream clinica_api_upstream {
    server clinica-api:8080;
    keepalive 16;
  }
 
  server {
    listen 80;

    # Custom Error Pages (Intermediário 2)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }

    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }

    # Headers de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /health {
      default_type application/json;
      return 200 '{"status":"ok","component":"nginx"}';
    }

    # Protege o Swagger UI
    location ^~ /swagger-ui/ {
      auth_basic "Swagger Restrito";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_intercept_errors on;

      proxy_pass http://clinica_api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

      # Protege o OpenAPI JSON
    location = /v3/api-docs {
      auth_basic "Swagger Restrito";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_intercept_errors on;

      proxy_pass http://clinica_api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso: tudo que chega no Nginx vai para a API
    location / {
      proxy_http_version 1.1;


      limit_req zone=api_limit burst=10 nodelay;
      client_max_body_size 1m;

      # Se vier algo para o erro 404 50x ele redireciona.
      proxy_intercept_errors on;

      # Encaminha para a API
      proxy_pass http://clinica_api_upstream;

      # Headers básicos de proxy (ajudam a API a saber origem real)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}