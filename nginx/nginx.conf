# Quantidade de processos de trabalho do Nginx
worker_processes  1;

events {
  # Número máximo de conexões simultâneas por worker
  worker_connections  1024;
}

http {
  # Cria uma zona em memória para controlar requisições por IP (5 por segundo)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

  # O retorno será 429 se ultrapassar o limite
  limit_req_status 429;
  
  # Ativa compressão das respostas para reduzir tráfego
  gzip on;
  gzip_comp_level 5;           # Nível de compressão equilibrado
  gzip_min_length 256;         # Só comprime respostas maiores que 256 bytes
  gzip_types application/json text/plain;  # Tipos que serão comprimidos

  # Formato personalizado do log de acesso
  log_format clinica_structured
    '$remote_addr - $request_method $request_uri '
    'status=$status upstream_time=$upstream_response_time request_time=$request_time '
    'bytes=$body_bytes_sent';

  # Define que o access log usará o formato acima
  access_log /var/log/nginx/access.log clinica_structured;
  
  # Define o destino interno da API dentro da rede Docker
  upstream clinica_api_upstream {
    server clinica-api:8080;
    keepalive 16;  # Mantém conexões abertas com a API para melhor desempenho
  }
 
  server {
    # Nginx escutando na porta 80
    listen 80;

    # Define páginas personalizadas para erros
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Arquivo utilizado quando ocorrer erro 404
    location = /404.html {
      root /usr/share/nginx/html;
      internal;  # Impede acesso direto à página
    }

    # Arquivo utilizado para erros de servidor (5xx)
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;  # Impede acesso direto à página
    }

    # Headers adicionados em todas as respostas para reforçar segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Endpoint simples para verificar se o Nginx está ativo
    location /health {
      default_type application/json;
      return 200 '{"status":"ok","component":"nginx"}';
    }

    # Protege o Swagger com autenticação básica
    location ^~ /swagger-ui/ {
      auth_basic "Swagger Restrito";
      auth_basic_user_file /etc/nginx/.htpasswd;

      # Permite que erros da API sejam interceptados pelo Nginx
      proxy_intercept_errors on;

      # Encaminha requisição para a API
      proxy_pass http://clinica_api_upstream;
      proxy_http_version 1.1;

      # Encaminha informações reais da requisição para a aplicação
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protege também o JSON do OpenAPI
    location = /v3/api-docs {
      auth_basic "Swagger Restrito";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_intercept_errors on;

      proxy_pass http://clinica_api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota principal: tudo que não foi tratado acima vai para a API
    location / {
      proxy_http_version 1.1;

      # Aplica controle de requisições por IP
      limit_req zone=api_limit burst=10 nodelay;

      # Limita tamanho máximo do corpo da requisição
      client_max_body_size 1m;

      # Permite que o Nginx substitua erros da API pelas páginas customizadas
      proxy_intercept_errors on;

      # Encaminha a requisição para a aplicação
      proxy_pass http://clinica_api_upstream;

      # Mantém informações da requisição original
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}